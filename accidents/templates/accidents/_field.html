<div class="field{% if field.errors %} has-err{% endif %}{% if field.name == 'police_description' %} wide{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small class="muted">{{ field.help_text }}</small>{% endif %}
  {% for e in field.errors %}<p class="err">{{ e }}</p>{% endfor %}
</div>
